[package]
name = "gone"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
notify = "8.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
